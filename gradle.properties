org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

kotlin.code.style=official

# The Maven coordinates, which happen to equal the Kotlin package namespace here
# and are still a separate decision. A groupId has to be a namespace the Central
# Portal can verify: a domain by a DNS TXT record, or a GitHub account by a
# public repository under it. `entid.org` is owned by this project and
# `org.entid` is verified against it, which is why the coordinate does not go
# through `io.github.<account>` — that route needs an account whose name stays
# claimed, and the previous one was released when the organisation was renamed.
group=org.entid
version=0.1.0-SNAPSHOT
