#
# The long running checks: fuzzing beyond a smoke run, mutation testing,
# benchmarks, and the ends of the supported toolchain range.

name: Scheduled

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      fuzzSeconds:
        description: How long to fuzz each target
        required: false
        default: '600'

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  long-fuzz:
    name: Long fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Fuzz the engine and the generator
        env:
          BUSINESSID_FUZZ_SECONDS: ${{ github.event.inputs.fuzzSeconds || '600' }}
        run: ./gradlew :businessid:fuzz :generator:fuzz -Pfuzz.seconds="$BUSINESSID_FUZZ_SECONDS"

      - name: Upload any finding
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: long-fuzz
          path: |
            **/.cifuzz-corpus/
            **/crash-*
          retention-days: 30

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run the JMH benchmarks
        run: ./gradlew :benchmarks:jmh -Pjmh.args="-f 2 -wi 5 -i 5 -r 2s -w 2s -rf json -rff benchmarks/build/jmh.json"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks
          path: benchmarks/build/jmh.json
          retention-days: 90

  toolchains:
    name: Toolchain ${{ matrix.jdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: ['17', '21', '25']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build and test
        run: ./gradlew build
