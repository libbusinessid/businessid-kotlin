name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by `release.yml`, so a tag runs the suite the branch runs rather than
  # a second definition of it that could drift.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      # The Android consumer is part of the verification, and `verify.sh` fails
      # rather than skipping it when there is no SDK.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'tools platform-tools platforms;android-36'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # `verify.sh` compiles and runs the code on the far end of the
          # supported range as well, through a Gradle toolchain that Gradle
          # provisions itself. Without `jdks` here that JDK is downloaded again
          # on every run: the action caches `caches` and `notifications` only.
          #
          # Provisioned rather than installed by `setup-java`, because Gradle
          # does not detect the `JAVA_HOME_<version>_<arch>` variables that
          # action exports — naming them here would make the range depend on a
          # runner architecture, and would be one more way for CI and a
          # developer's machine to disagree about what `verify.sh` verified.
          gradle-home-cache-includes: |
            caches
            notifications
            jdks

      # For the conformance runner, which comes from `spec` and from nowhere
      # else, pinned by `verify.sh` to the commit rules.lock records.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      # The entry point of engine.md section 12.6, and the same command a
      # developer runs. One line when it passes; the failing step and only that
      # when it does not. There is no second definition of green here.
      - name: Verify
        run: ./scripts/verify.sh

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Fuzz the engine and the generator
        run: ./gradlew :entid:fuzz :generator:fuzz

      - name: Upload any finding
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-findings
          path: |
            **/.cifuzz-corpus/
            **/crash-*
          retention-days: 30

  publication:
    name: Release rehearsal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # A key that exists for the length of this job and signs nothing anyone
      # will ever receive. It is here so that `scripts/release-bundle.sh` — the
      # script a tag runs, with the real key, against a registry that keeps what
      # it is given for ever — has run before that tag exists. This project has
      # shipped a release where seven of nine defects were in steps that had
      # never been able to run once.
      - name: A throwaway signing key
        run: |
          set -euo pipefail
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          cat > "$GNUPGHOME/params" <<'EOF'
          Key-Type: RSA
          Key-Length: 3072
          Name-Real: EntID release rehearsal
          Name-Email: rehearsal@invalid
          Expire-Date: 0
          Passphrase: rehearsal
          %commit
          EOF
          gpg --batch --pinentry-mode loopback --gen-key "$GNUPGHOME/params"
          key="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')"
          {
            echo 'SIGNING_KEY<<REHEARSAL_KEY_EOF'
            gpg --batch --pinentry-mode loopback --passphrase rehearsal \
              --armor --export-secret-keys "$key"
            echo 'REHEARSAL_KEY_EOF'
          } >> "$GITHUB_ENV"

      # The version a tag would carry, read where the release guard reads it.
      - name: Build the bundle the Central Portal would receive
        env:
          SIGNING_PASSWORD: rehearsal
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*VALUE: String = "\(.*\)".*/\1/p' \
            entid/src/main/kotlin/org/entid/internal/EngineVersion.kt)"
          ./scripts/release-bundle.sh "$version"

      - name: What would be published
        run: unzip -Z1 build/central-bundle.zip | sort

      - name: Upload the bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: central-bundle
          path: build/central-bundle.zip
          retention-days: 7
