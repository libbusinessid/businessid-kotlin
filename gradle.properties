org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

kotlin.code.style=official

# The Maven coordinates, which are not the Kotlin package namespace: the code
# stays under `io.libbusinessid`. A groupId has to be a namespace the Central
# Portal can verify, and it verifies a domain by DNS or a GitHub account by a
# repository — `libbusinessid.io` is a domain nobody here owns, while
# `io.github.libbusinessid` is the GitHub organisation this repository is in.
group=io.github.libbusinessid
version=0.1.0-SNAPSHOT
